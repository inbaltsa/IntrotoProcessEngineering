  const N = 5;

  // ---------- text helpers ----------
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // `math`, *green bold*, ^red bold^
  function fmt(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<span class="m">$1</span>')
      .replace(/\*([^*]+)\*/g, '<b class="g">$1</b>')
      .replace(/\^([^^]+)\^/g, '<b class="r">$1</b>');
  }
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  const num = (v) => { const x = parseFloat(String(v).replace(",", ".").replace("−", "-")); return isNaN(x) ? null : x; };
  function setFb(box, ok, text) { box.className = "fb " + (ok ? "ok" : "bad"); box.innerHTML = fmt(text); }
  const near = (a, tol) => (v) => Math.abs(v - a) <= tol;

  // A number question. cases = [{test(v), ok, text}], first match wins; fallback otherwise.
  function numQ(label, cases, fallback, onOk) {
    const w = el(`<div class="box"><div>${label}</div>
      <div class="row"><input class="ans" type="text" inputmode="decimal" aria-label="תשובה"><button type="button" class="btn">${esc(T.btnCheck)}</button></div>
      <div class="fb hidden" role="status"></div></div>`);
    const inp = w.querySelector("input"), out = w.querySelector(".fb");
    function check() {
      const v = num(inp.value);
      const hit = v === null ? null : cases.find((c) => c.test(v));
      if (hit) { setFb(out, hit.ok, hit.text); if (hit.ok && onOk) onOk(); }
      else setFb(out, false, fallback);
    }
    w.querySelector(".btn").addEventListener("click", check);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    return w;
  }
  // A buttons question. opts = [{label, ok, text}]
  function choiceQ(label, opts, onOk) {
    const w = el(`<div class="box"><div>${label}</div><div class="row"></div><div class="fb hidden" role="status"></div></div>`);
    const row = w.querySelector(".row"), out = w.querySelector(".fb");
    opts.forEach((o) => {
      const b = el(`<button type="button" class="btn">${fmt(o.label)}</button>`);
      b.addEventListener("click", () => {
        row.querySelectorAll(".btn").forEach((x) => x.classList.remove("sel"));
        b.classList.add("sel");
        setFb(out, o.ok, o.text);
        if (o.ok && onOk) onOk();
      });
      row.appendChild(b);
    });
    return w;
  }

  const H = (s) => `<span class="hl">${s}</span>`;
  // A fraction for the unit ruler, as inline HTML.
  const frac = (top, bot) => `<span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25">
      <span style="border-bottom:1.5px solid currentColor;padding:0 4px">${top}</span><span style="padding:0 4px">${bot}</span></span>`;
  // Two green-header columns: "define the ratio" vs "find the value".
  function twoCols(a, b) {
    const col = (c, cls) => `<div class="col ${cls}"><h3>${fmt(c.head)}</h3><div class="in"><div class="q">${fmt(c.q)}</div>
        <div class="eq m up">${c.eq}</div><div class="where">${fmt(c.where)}</div>
        <div class="use">${fmt(c.use)}<div class="m up" style="font-size:19px;margin-top:4px">${c.useEq}</div></div></div></div>`;
    return el(`<div class="cols">${col(a, "")}${col(b, "b")}</div>`);
  }
  // A reference bar covered by sticks; rows = [{len, stick, color, label}]. Returns SVG.
  function sticks(rows, width) {
    const W = width || 640, x0 = 20, rowH = 46;
    let s = `<svg viewBox="0 0 ${W} ${rows.length * rowH + 14}">`;
    rows.forEach((r, i) => {
      const y = 10 + i * rowH;
      for (let x = 0; x < r.len - 0.5; x += r.stick) {
        const w = Math.min(r.stick, r.len - x), part = w < r.stick - 0.5;
        s += `<rect x="${x0 + x + 1.5}" y="${y}" width="${w - 3}" height="22" rx="3" fill="${r.color}" opacity="${part ? .35 : 1}"/>`;
      }
      s += `<text x="${x0 + r.len + 12}" y="${y + 17}" font-family="Arial" font-size="17" fill="#1F2933">${esc(r.label)}</text>`;
    });
    return s + `</svg>`;
  }

  // ---------- frame ----------
  const state = { i: 0, done: Array(N).fill(false) };
  document.getElementById("chapter").textContent = T.chapter;
  document.getElementById("foot").textContent = T.footer;
  const pills = document.getElementById("pills"), screens = document.getElementById("screens");
  const titles = [T.s1_title, T.s2_title, T.s3_title, T.s4_title, T.s5_title];
  titles.forEach((t, i) => {
    const b = el(`<button type="button" aria-label="מסך ${i + 1}: ${esc(t)}"></button>`);
    b.addEventListener("click", () => go(i));
    pills.appendChild(b);
  });
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  prev.textContent = T.btnPrev; next.textContent = T.btnNext;
  prev.addEventListener("click", () => go(state.i - 1));
  next.addEventListener("click", () => go(state.i + 1));
  const done = (i) => { state.done[i] = true; paint(); };
  function paint() {
    [...pills.children].forEach((b, i) => { b.classList.toggle("on", i === state.i); b.classList.toggle("done", state.done[i] && i !== state.i); });
    [...screens.children].forEach((s, i) => s.classList.toggle("hidden", i !== state.i));
    document.getElementById("title").innerHTML = fmt(titles[state.i]);
    document.getElementById("pg").textContent = `${state.i + 1} / ${N}`;
    prev.disabled = state.i === 0; next.disabled = state.i === N - 1;
  }
  function go(i) {
    if (i < 0 || i >= N) return;
    state.i = i; paint();
    // a screen whose drawing depends on its width redraws once visible
    document.dispatchEvent(new CustomEvent("screen", { detail: i }));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ================= 1: two questions =================
  (function () {
    const s = el(`<section></section>`);
    s.appendChild(el(`<p>${fmt(T.s1_lead)}</p>`));
    const M = 220, FT = M / 3.28;
    s.appendChild(el(`<div class="stage">${sticks([
      { len: M, stick: M, color: "#549E39", label: "1 m" },
      { len: M, stick: FT, color: "#8E7CC3", label: "? ft" }])}</div>`));
    const partB = el(`<div class="hidden"></div>`);
    s.appendChild(numQ(`<div class="qrow"><span class="num">1</span><span><span class="tag">${fmt(T.s1_qA_tag)}</span>${fmt(T.s1_qA)}</span></div>`,
      [{ test: near(3.28, 0.03), ok: true, text: T.s1_qA_ok }], T.s1_qA_bad, () => partB.classList.remove("hidden")));
    partB.appendChild(el(`<div class="stage">${sticks([
      { len: 2 * M, stick: M, color: "#549E39", label: "2 m" },
      { len: 2 * M, stick: FT, color: "#8E7CC3", label: "? ft" }])}</div>`));
    const names = el(`<div class="call plain hidden">${fmt(T.s1_names)}</div>`);
    partB.appendChild(numQ(`<div class="qrow"><span class="num">2</span><span><span class="tag">${fmt(T.s1_qB_tag)}</span>${fmt(T.s1_qB)}</span></div>`,
      [{ test: near(6.56, 0.06), ok: true, text: T.s1_qB_ok }], T.s1_qB_bad,
      () => { names.classList.remove("hidden"); done(0); }));
    partB.appendChild(names);
    s.appendChild(partB);
    screens.appendChild(s);
  })();

  // ================= 2: inverse operations =================
  (function () {
    const s = el(`<section class="hidden"></section>`);
    s.appendChild(twoCols(
      { head: T.s2_colA, q: T.s2_colA_q, eq: `1 m = ${H("3.28")} ft`, where: T.s2_colA_where, use: T.s2_colA_use,
        useEq: `${frac("3.28 ft", "1 m")} &nbsp;או&nbsp; ${frac("1 m", "3.28 ft")}` },
      { head: T.s2_colB, q: T.s2_colB_q, eq: `L(ft) = ${frac(H("3.28") + " ft", "1 m")} · L(m)`, where: T.s2_colB_where, use: T.s2_colB_use,
        useEq: `3.28 ft/m · 2 m = 6.56 ft` }));
    s.appendChild(el(`<div class="call red">${fmt(T.s2_alert)}</div>`));
    s.appendChild(el(`<p>${fmt(T.s2_why)}</p>`));

    const steps = el(`<div class="box"><div class="steps">
        <div><span>2 m = 2 × (1 m)</span><span class="why">מספר × יחידה</span></div>
        <div><span>&nbsp;&nbsp;&nbsp;&nbsp;= 2 × (3.28 ft)</span><span class="why">הגדרת היחס: מחליפים את היחידה</span></div>
        <div><span>&nbsp;&nbsp;&nbsp;&nbsp;= (2 × 3.28) ft</span><span class="why">מקבצים את המספרים</span></div>
        <div><span>&nbsp;&nbsp;&nbsp;&nbsp;= 6.56 ft</span><span class="why">זה הערך הנומרי</span></div>
      </div><div class="row"><button type="button" class="btn">${esc(T.s2_btnSteps)}</button></div></div>`);
    const lines = steps.querySelectorAll(".steps div");
    let k = 0;
    steps.querySelector(".btn").addEventListener("click", (e) => {
      if (k < lines.length) lines[k++].classList.add("show");
      if (k === lines.length) e.target.disabled = true;
    });
    s.appendChild(steps);

    // unit size vs number: the product is always the same table
    const U = [{ n: "m", per: 1 }, { n: "ft", per: 3.28 }, { n: "cm", per: 100 }];
    const uBox = el(`<div class="box"><div>${fmt(T.s2_unitsLead)}</div><div class="row"></div><div class="units"></div></div>`);
    const ubtns = uBox.querySelector(".row"), uview = uBox.querySelector(".units");
    function showUnit(u) {
      ubtns.querySelectorAll(".btn").forEach((b) => b.classList.toggle("sel", b.dataset.u === u.n));
      const size = 100 / u.per, value = +(2 * u.per).toFixed(2);
      uview.innerHTML = `
        <div class="urow"><span class="lab" style="color:#3A7525;font-weight:700">${value}</span><span style="font-size:14px;color:#52606D;text-align:left">← המספר</span><span></span></div>
        <div class="urow"><span class="lab">×</span><span class="unit" style="width:${Math.max(size / 2, 0.8)}%"></span><span class="uname">1 ${u.n}</span></div>
        <div class="urow"><span class="lab">=</span><span class="unit" style="width:100%;background:#C9A227"></span><span class="uname">2 m</span></div>`;
    }
    U.forEach((u) => {
      const b = el(`<button type="button" class="btn" data-u="${u.n}">${u.n}</button>`);
      b.addEventListener("click", () => showUnit(u));
      ubtns.appendChild(b);
    });
    showUnit(U[0]);
    s.appendChild(uBox);

    s.appendChild(choiceQ(fmt(T.s2_check), [
      { label: T.s2_optA, ok: true, text: T.s2_okA },
      { label: T.s2_optB, ok: false, text: T.s2_badB }], () => done(1)));
    screens.appendChild(s);
  })();

  // ================= 3: a degree is a unit =================
  (function () {
    const s = el(`<section class="hidden"></section>`);
    s.appendChild(el(`<p>${fmt(T.s3_lead)}</p>`));
    const L = 470;
    s.appendChild(el(`<div class="stage">${sticks([
      { len: L, stick: L / 10, color: "#549E39", label: T.s3_lblC },
      { len: L, stick: L / 18, color: "#8E7CC3", label: T.s3_lblF }], 640)}</div>`));
    s.appendChild(twoCols(
      { head: T.s2_colA, q: T.s2_colA_q, eq: `1 °C = ${H("1.8")} °F`, where: T.s3_colA_where, use: T.s3_colA_use,
        useEq: `${frac("1 °C", "1.8 °F")} &nbsp;או&nbsp; ${frac("1.8 °F", "1 °C")}` },
      { head: T.s2_colB, q: T.s2_colB_q, eq: `ΔT(°F) = ${frac(H("1.8") + " °F", "1 °C")} · ΔT(°C)`, where: T.s3_colB_where, use: T.s3_colB_use,
        useEq: `1.8 °F/°C · 10 °C = 18 °F` }));
    s.appendChild(el(`<div class="call plain">${fmt(T.s3_note)}</div>`));
    s.appendChild(numQ(fmt(T.s3_ask), [
      { test: near(45, 0.6), ok: true, text: T.s3_ok },
      { test: near(13.9, 0.3), ok: false, text: T.s3_bad13 },
      { test: near(77, 0.6), ok: false, text: T.s3_bad77 }], T.s3_badX, () => done(2)));
    screens.appendChild(s);
  })();

  // ================= 4: a thermometer reading =================
  (function () {
    const s = el(`<section class="hidden"></section>`);
    s.appendChild(el(`<p>${fmt(T.s4_lead)}</p>`));
    const stage = el(`<div class="stage"></div>`);
    const slider = el(`<input type="range" min="-20" max="100" step="1" value="25" style="width:100%;direction:ltr;accent-color:#3A7525" aria-label="טמפרטורה במעלות צלזיוס">`);
    const read = el(`<div class="box" style="text-align:center"></div>`);
    s.appendChild(stage); s.appendChild(slider); s.appendChild(read);
    const W = 640, X0 = 30, X1 = W - 30, CMIN = -25, CMAX = 105;
    const xC = (c) => X0 + (c - CMIN) / (CMAX - CMIN) * (X1 - X0);
    function draw() {
      const c = +slider.value, f = 1.8 * c + 32;
      // on a phone the drawing shrinks, so labels are larger and sparser
      const narrow = stage.clientWidth > 0 && stage.clientWidth < 520;
      const fs = narrow ? 22 : 13, cs = narrow ? 20 : 10, fstep = narrow ? 40 : 20;
      const yC = 46, yF = 130;
      let g = `<svg viewBox="0 0 ${W} 190">`;
      g += `<line x1="${X0}" y1="${yC}" x2="${X1}" y2="${yC}" stroke="#549E39" stroke-width="3"/>`;
      g += `<line x1="${X0}" y1="${yF}" x2="${X1}" y2="${yF}" stroke="#8E7CC3" stroke-width="3"/>`;
      for (let t = -20; t <= 100; t += 10) {
        const x = xC(t);
        g += `<line x1="${x}" y1="${yC - 8}" x2="${x}" y2="${yC}" stroke="#549E39" stroke-width="${t === 0 ? 3 : 1.5}"/>`;
        if (t % cs === 0) g += `<text x="${x}" y="${yC - 14}" text-anchor="middle" font-family="Arial" font-size="${fs}" fill="${t === 0 ? "#C00000" : "#3A7525"}" font-weight="${t === 0 ? 700 : 400}">${t}</text>`;
      }
      for (let ff = -20; ff <= 220; ff += 20) {
        const x = xC((ff - 32) / 1.8);
        if (x < X0 - 1 || x > X1 + 1) continue;
        g += `<line x1="${x}" y1="${yF}" x2="${x}" y2="${yF + 8}" stroke="#8E7CC3" stroke-width="${ff === 0 ? 3 : 1.5}"/>`;
        if (ff % fstep === 0) g += `<text x="${x}" y="${yF + 12 + fs}" text-anchor="middle" font-family="Arial" font-size="${fs}" fill="${ff === 0 ? "#C00000" : "#6b5aa6"}" font-weight="${ff === 0 ? 700 : 400}">${ff}</text>`;
      }
      // where 0 °C sits on the F scale
      g += `<line x1="${xC(0)}" y1="${yC}" x2="${xC(0)}" y2="${yF}" stroke="#C00000" stroke-dasharray="4 4"/>`;
      g += `<text x="${xC(0) + 6}" y="${(yC + yF) / 2 + 5}" font-family="Arial" font-size="${fs}" fill="#C00000">0 °C = 32 °F</text>`;
      const x = xC(c);
      g += `<line x1="${x}" y1="${yC - 2}" x2="${x}" y2="${yF + 2}" stroke="#1F2933" stroke-width="2.5"/>`;
      g += `<circle cx="${x}" cy="${yC}" r="6" fill="#1F2933"/><circle cx="${x}" cy="${yF}" r="6" fill="#1F2933"/>`;
      g += `<text x="${X1}" y="${yC + 26}" text-anchor="end" font-family="Arial" font-size="${fs}" fill="#3A7525">°C</text>`;
      g += `<text x="${X1}" y="${yF - 12}" text-anchor="end" font-family="Arial" font-size="${fs}" fill="#6b5aa6">°F</text>`;
      stage.innerHTML = g + `</svg>`;
      read.innerHTML = `<span class="m up" style="font-size:22px">T(°F) = ${frac(H("1.8") + " °F", "1 °C")} · ${c} °C <span style="color:#C00000;font-weight:700">+ 32 °F</span> = ${Math.round(f * 10) / 10} °F</span>`;
    }
    slider.addEventListener("input", draw);
    document.addEventListener("screen", (e) => { if (e.detail === 3) draw(); });
    window.addEventListener("resize", () => { if (state.i === 3) draw(); });
    draw();
    s.appendChild(el(`<div class="call red">${fmt(T.s4_alert)}</div>`));
    s.appendChild(el(`<div class="cols" style="grid-template-columns:1fr">
      <div class="col b"><h3>${fmt(T.s4_colB)}</h3><div class="in">
        <div class="eq m up">T(°F) = ${frac(H("1.8") + " °F", "1 °C")} · T(°C) <span style="color:#C00000">+ 32 °F</span></div>
        <div class="where">${fmt(T.s4_why32)}</div></div></div></div>`));
    s.appendChild(el(`<p>${fmt(T.s4_ruler)}</p>`));
    s.appendChild(numQ(fmt(T.s4_ask), [
      { test: near(77, 0.6), ok: true, text: T.s4_ok },
      { test: near(45, 0.6), ok: false, text: T.s4_bad45 }], T.s4_badX, () => done(3)));
    screens.appendChild(s);
  })();

  // ================= 5: summary and check =================
  (function () {
    const s = el(`<section class="hidden"></section>`);
    const h = T.s5_rowHead;
    s.appendChild(el(`<p>${fmt(T.s5_lead)}</p>`));
    s.appendChild(el(`<div class="box"><div class="qrow"><span class="num">1</span><span>${fmt(T.s5_ask1)}</span></div>
      <div class="qrow" style="margin-top:8px"><span class="num">2</span><span>${fmt(T.s5_ask2)}</span></div></div>`));
    s.appendChild(el(`<table class="sum"><thead><tr><th>${esc(h[0])}</th><th>${esc(h[1])}</th><th>${esc(h[2])}</th></tr></thead>
      <tbody>${T.s5_rows.map((r) => `<tr><td>${fmt(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td></tr>`).join("")}</tbody></table>`));
    const got = { mc: false, items: T.s5_items.map(() => false) };
    const fin = el(`<div class="call hidden">${fmt(T.s5_done)}</div>`);
    const check = () => { if (got.mc && got.items.every(Boolean)) { fin.classList.remove("hidden"); done(4); } };
    s.appendChild(choiceQ(fmt(T.s5_q), [
      { label: T.s5_optA, ok: true, text: T.s5_okA },
      { label: T.s5_optB, ok: false, text: T.s5_badB }], () => { got.mc = true; check(); }));
    s.appendChild(el(`<p style="font-weight:700;margin-top:16px">${fmt(T.s5_sortLead)}</p>`));
    T.s5_items.forEach((it, i) => {
      const q = choiceQ(fmt(it.q), T.s5_opts.map((o, j) => ({ label: o, ok: j === it.a, text: j === it.a ? it.ok : it.bad })),
        () => { got.items[i] = true; check(); });
      q.classList.add("item");
      s.appendChild(q);
    });
    s.appendChild(fin);
    screens.appendChild(s);
  })();

  paint();
})();
</script>
</body>
</html>
