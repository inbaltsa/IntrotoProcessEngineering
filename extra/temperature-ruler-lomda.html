<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }

  .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
  .btn { font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; border-radius: 3px; padding: 9px 18px;

  .btn:hover { border-color: var(--muted); }

  .btn:disabled { opacity: .35; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .count { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--text2); min-height: 1.6em; }
  .count.m, .count.c { color: var(--teal); } .count.ft, .count.f { color: var(--purple); }

  .eqs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .eq { border: 1px solid var(--line); border-radius: 4px; padding: 12px; background: var(--card2); text-align: center; }
  .eq .lbl { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }

  .hl { color: var(--amber2); font-weight: 600; background: rgba(227,171,69,.13); padding: 0 4px; border-radius: 3px; }
  .tm { color: var(--teal); } .tf { color: var(--purple); }

  .fb.ok { background: var(--ok-bg); border: 1px solid var(--ok-line); color: var(--ok-text); }
  .fb.bad { background: var(--bad-bg); border: 1px solid var(--bad-line); color: var(--bad-text); }
  .fb b { color: inherit; }
  .note { border-right: 3px solid var(--amber); padding: 6px 14px; margin: 14px 0 4px; color: var(--text2); background: rgba(227,171,69,.05); }
  .q { margin-top: 16px; font-weight: 500; color: var(--text); }
  .hidden { display: none !important; }

  .tabs { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .slider { width: 100%; direction: ltr; accent-color: var(--amber); }

  .item .qq { color: var(--text); margin-bottom: 8px; }
  .num { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
  .num span.lab { flex: 1 1 260px; color: var(--text2); }
  .num input { width: 110px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; padding: 7px 10px; border-radius: 3px;
               background: var(--bg); color: var(--text); border: 1px solid var(--line); direction: ltr; text-align: center; }
  .num input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
  .num .res { font-size: 14px; min-width: 120px; }
  .num .res.ok { color: var(--teal); } .num .res.bad { color: var(--bad-text); }

  .prog h3 { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .prog ul { list-style: none; margin: 0; padding: 0; }
  .prog li { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 15px; margin: 6px 0; }
  .prog li .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 12px; }
  .prog li.done { color: var(--text2); } .prog li.done .dot { border-color: var(--teal); background: var(--ok-bg); color: var(--teal); }
  .prog .foot { border-top: 2px solid var(--line); margin-top: 12px; padding-top: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--dim); }
  .pager { display: flex; justify-content: space-between; margin-top: 8px; }

  @media (max-width: 640px) {
    .card { padding: 18px 14px; }
    .eqs, .readout { grid-template-columns: 1fr; }
    .nav button .t { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  const T = window.LOMDA_TEXT;

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // *bold* and `code` markup used in LOMDA_TEXT
  function fmt(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*([^*]+)\*/g, "<b>$1</b>")
      // keep "25 °C" / "°F" in reading order inside Hebrew sentences
      // (only "−" counts as a minus sign: the "-" in "מ-20" is a Hebrew prefix)
      .replace(/(?:−?\d[\d.]*\s?)?°[CFR]/g, '<span class="u">$&</span>');
  }
  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function fb(box, ok, text) {
    box.className = "fb " + (ok ? "ok" : "bad");
    box.innerHTML = fmt(text);
  }
  function parseNum(v) {
    const x = parseFloat(String(v).replace(",", ".").replace("−", "-"));
    return isNaN(x) ? null : x;
  }
  const r1 = (x) => (Math.round(x * 10) / 10).toFixed(1);

  // ---------- state ----------
  const state = { step: 0, done: [false, false, false, false, false] };
  const app = document.getElementById("app");

  app.appendChild(el(`
    <header>
      <div class="eyebrow">${fmt(T.eyebrow)}</div>
      <h1>${fmt(T.title)}</h1>
      <p class="subtitle">${fmt(T.subtitle)}</p>
    </header>`));

  const nav = el(`<nav class="nav" aria-label="שלבים"></nav>`);
  [T.nav1, T.nav2, T.nav3, T.nav4, T.nav5].forEach((t, i) => {
    const b = el(`<button type="button"><span class="n">0${i + 1}</span><span class="t">${fmt(t)}</span></button>`);
    b.addEventListener("click", () => go(i));
    nav.appendChild(b);
  });
  app.appendChild(nav);

  const stepsBox = el(`<div></div>`);
  app.appendChild(stepsBox);

  const prog = el(`<section class="card prog"><h3>${fmt(T.progTitle)}</h3><ul></ul><div class="foot">${fmt(T.progFoot)}</div></section>`);
  [T.prog1, T.prog2, T.prog3, T.prog4, T.prog5].forEach((t) => {
    prog.querySelector("ul").appendChild(el(`<li><span class="dot"></span><span>${fmt(t)}</span></li>`));
  });
  app.appendChild(prog);

  const pager = el(`<div class="pager">
      <button type="button" class="btn primary" id="next">${fmt(T.btnNext)}</button>
      <button type="button" class="btn" id="prev">${fmt(T.btnPrev)}</button>
    </div>`);
  app.appendChild(pager);
  pager.querySelector("#next").addEventListener("click", () => go(state.step + 1));
  pager.querySelector("#prev").addEventListener("click", () => go(state.step - 1));

  function markDone(i) {
    state.done[i] = true;
    render();
  }
  function render() {
    [...nav.children].forEach((b, i) => {
      b.classList.toggle("on", i === state.step);
      b.classList.toggle("done", state.done[i]);
      b.setAttribute("aria-current", i === state.step ? "step" : "false");
    });
    [...stepsBox.children].forEach((s, i) => s.classList.toggle("hidden", i !== state.step));
    [...prog.querySelectorAll("li")].forEach((li, i) => {
      li.classList.toggle("done", state.done[i]);
      li.querySelector(".dot").textContent = state.done[i] ? "✓" : "";
    });
    pager.querySelector("#prev").disabled = state.step === 0;
    pager.querySelector("#next").disabled = state.step === 4;
  }
  function go(i) {
    if (i < 0 || i > 4) return;
    state.step = i;
    render();
    // let a step redraw once it is visible (its drawing depends on the width)
    document.dispatchEvent(new CustomEvent("lomda:step", { detail: i }));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // A two-option question; onOk runs once the right option is picked.
  function choice(container, question, options, onOk) {
    const box = el(`<div><p class="q">${fmt(question)}</p><div class="row"></div><div class="fb hidden"></div></div>`);
    const row = box.querySelector(".row"), out = box.querySelector(".fb");
    options.forEach((o) => {
      const b = el(`<button type="button" class="btn">${fmt(o.label)}</button>`);
      b.addEventListener("click", () => {
        row.querySelectorAll(".btn").forEach((x) => x.classList.remove("sel"));
        b.classList.add("sel");
        fb(out, o.ok, o.fb);
        if (o.ok && onOk) onOk();
      });
      row.appendChild(b);
    });
    container.appendChild(box);
    return box;
  }

  // Sticks of width `stick` px tiled over a bar of width `len` px, starting at x0.
  function sticksSvg(len, stick, color, labelEvery, totalLabel) {
    const H = 120, x0 = 40, y = 58, W = len + 80;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(totalLabel)}">`;
    s += `<rect x="${x0}" y="${y - 22}" width="${len}" height="20" fill="#c99a3e" opacity=".9" rx="2"/>`;
    let n = 0;
    for (let x = 0; x < len - 0.5; x += stick, n++) {
      const w = Math.min(stick, len - x);
      const partial = w < stick - 0.5;
      s += `<rect x="${x0 + x + 1}" y="${y + 4}" width="${w - 2}" height="14" rx="2" fill="${color}" opacity="${partial ? 0.35 : 0.85}"/>`;
      if (!partial && ((n + 1) % labelEvery === 0)) {
        s += `<text x="${x0 + x + w - 2}" y="${y + 36}" fill="${color}" font-family="IBM Plex Mono" font-size="12" text-anchor="end">${n + 1}</text>`;
      }
    }
    s += `<text x="${x0}" y="${y - 30}" fill="#8b99ae" font-family="IBM Plex Mono" font-size="12">${esc(totalLabel)}</text>`;
    s += `</svg>`;
    return s;
  }

  // ================= STEP 1 =================
  (function () {
    const c = el(`<section class="card"></section>`);
    c.innerHTML = `<h2>${fmt(T.s1_title)}</h2><p>${fmt(T.s1_intro)}</p>
      <div class="row"><button type="button" class="btn" data-k="m">${fmt(T.s1_btnM)}</button>
      <button type="button" class="btn" data-k="ft">${fmt(T.s1_btnFt)}</button></div>
      <div class="stage"></div><div class="count"></div><div class="after hidden"></div>`;
    const stage = c.querySelector(".stage"), count = c.querySelector(".count"), after = c.querySelector(".after");
    const LEN = 560, PER_M = LEN / 2;
    const seen = { m: false, ft: false };
    function show(k) {
      c.querySelectorAll("[data-k]").forEach((b) => b.classList.toggle("sel", b.dataset.k === k));
      if (k === "m") stage.innerHTML = sticksSvg(LEN, PER_M, "#5ed3ae", 1, "2 m");
      else stage.innerHTML = sticksSvg(LEN, PER_M / 3.28, "#a08df2", 1, "2 m");
      count.className = "count " + k;
      count.innerHTML = fmt(k === "m" ? T.s1_countM : T.s1_countFt);
      seen[k] = true;
      if (seen.m && seen.ft) after.classList.remove("hidden");
    }
    c.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
    stage.innerHTML = sticksSvg(LEN, LEN, "transparent", 99, "2 m");

    choice(after, T.s1_q, [
      { label: T.s1_qA, ok: true, fb: T.s1_qOk },
      { label: T.s1_qB, ok: false, fb: T.s1_qBad }
    ], () => eqBox.classList.remove("hidden"));

    const eqBox = el(`<div class="hidden"><p>${fmt(T.s1_eqIntro)}</p>
      <div class="eqs">
        <div class="eq"><span class="lbl">${fmt(T.s1_eqUnit)}</span><span class="math"><span class="tm">1 m</span> = <span class="hl">3.28</span> <span class="tf">ft</span></span></div>
        <div class="eq"><span class="lbl">${fmt(T.s1_eqNum)}</span><span class="math">N(<span class="tf">ft</span>) = <span class="hl">3.28</span> · N(<span class="tm">m</span>)</span></div>
      </div></div>`);
    after.appendChild(eqBox);
    choice(eqBox, T.s1_flipQ, [
      { label: T.s1_flipA, ok: true, fb: T.s1_flipOk },
      { label: T.s1_flipB, ok: false, fb: T.s1_flipBad }
    ], () => { note.classList.remove("hidden"); markDone(0); });
    const note = el(`<div class="note hidden">${fmt(T.s1_note)}</div>`);
    eqBox.appendChild(note);
    stepsBox.appendChild(c);
  })();

  // ================= STEP 2 =================
  (function () {
    const c = el(`<section class="card hidden"></section>`);
    c.innerHTML = `<h2>${fmt(T.s2_title)}</h2><p>${fmt(T.s2_intro)}</p>
      <div class="row"><button type="button" class="btn" data-k="c">${fmt(T.s2_btnC)}</button>
      <button type="button" class="btn" data-k="f">${fmt(T.s2_btnF)}</button></div>
      <div class="stage"></div><div class="count"></div>
      <div class="after hidden">
        <div class="num"><span class="lab">${fmt(T.s2_ask)}</span><input type="text" inputmode="decimal" aria-label="מעלות פרנהייט במעלת צלזיוס"><button type="button" class="btn">${fmt(T.s5_check)}</button></div>
        <div class="fb hidden"></div>
        <div class="eqbox hidden"><p>${fmt(T.s2_eqIntro)}</p>
          <div class="eqs">
            <div class="eq"><span class="lbl">${fmt(T.s2_eqUnit)}</span><span class="math"><span class="tm">1 °C</span> = <span class="hl">1.8</span> <span class="tf">°F</span></span></div>
            <div class="eq"><span class="lbl">${fmt(T.s2_eqNum)}</span><span class="math">ΔT(<span class="tf">°F</span>) = <span class="hl">1.8</span> · ΔT(<span class="tm">°C</span>)</span></div>
          </div>
          <div class="note">${fmt(T.s2_note)}</div>
        </div>
      </div>`;
    const stage = c.querySelector(".stage"), count = c.querySelector(".count"), after = c.querySelector(".after");
    const LEN = 560, PER_C = LEN / 10;
    const seen = { c: false, f: false };
    function show(k) {
      c.querySelectorAll("[data-k]").forEach((b) => b.classList.toggle("sel", b.dataset.k === k));
      stage.innerHTML = k === "c"
        ? sticksSvg(LEN, PER_C, "#5ed3ae", 1, "20 °C → 30 °C")
        : sticksSvg(LEN, PER_C / 1.8, "#a08df2", 2, "20 °C → 30 °C");
      count.className = "count " + k;
      count.innerHTML = fmt(k === "c" ? T.s2_countC : T.s2_countF);
      seen[k] = true;
      if (seen.c && seen.f) after.classList.remove("hidden");
    }
    c.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
    stage.innerHTML = sticksSvg(LEN, LEN, "transparent", 99, "20 °C → 30 °C");

    const input = after.querySelector("input"), out = after.querySelector(".fb");
    function check() {
      const v = parseNum(input.value);
      const ok = v !== null && Math.abs(v - 1.8) < 0.01;
      fb(out, ok, ok ? T.s2_ok : T.s2_bad);
      if (ok) { after.querySelector(".eqbox").classList.remove("hidden"); markDone(1); }
    }
    after.querySelector(".num .btn").addEventListener("click", check);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
    stepsBox.appendChild(c);
  })();

  // ================= STEP 3 =================
  (function () {
    const c = el(`<section class="card hidden"></section>`);
    c.innerHTML = `<h2>${fmt(T.s3_title)}</h2><p>${fmt(T.s3_intro)}</p>
      <div class="tabs"><button type="button" class="btn sel" data-m="point">${fmt(T.s3_tabPoint)}</button>
      <button type="button" class="btn" data-m="gap">${fmt(T.s3_tabGap)}</button></div>
      <div class="stage"></div>
      <div class="sliders"></div>
      <div class="readout"></div>
      <div class="note"></div>
      <div class="qbox"></div>`;
    const stage = c.querySelector(".stage"), sl = c.querySelector(".sliders"),
          ro = c.querySelector(".readout"), note = c.querySelector(".note");
    const CMIN = -25, CMAX = 110, W = 640, X0 = 30, X1 = W - 30;
    const xC = (tc) => X0 + (tc - CMIN) / (CMAX - CMIN) * (X1 - X0);
    let mode = "point", a = 25, b = 60;
    const seenGap = { moved: false };

    function svg() {
      // On a phone the drawing shrinks, so labels are drawn larger and sparser.
      const narrow = stage.clientWidth > 0 && stage.clientWidth < 560;
      const fs = narrow ? 22 : 11, fsBig = narrow ? 24 : 13, cStep = narrow ? 20 : 10, fStep = narrow ? 40 : 20;
      let s = `<svg viewBox="0 0 ${W} 210" role="img" aria-label="סולם צלזיוס מעל סולם פרנהייט">`;
      const yC = 60, yF = 140;
      s += `<line x1="${X0}" y1="${yC}" x2="${X1}" y2="${yC}" stroke="#5ed3ae" stroke-width="2"/>`;
      s += `<line x1="${X0}" y1="${yF}" x2="${X1}" y2="${yF}" stroke="#a08df2" stroke-width="2"/>`;
      s += `<text x="${X0}" y="${yC - 22 - fsBig}" fill="#5ed3ae" font-family="IBM Plex Mono" font-size="${fsBig}">°C</text>`;
      s += `<text x="${X0}" y="${yF + 20 + 2 * fs}" fill="#a08df2" font-family="IBM Plex Mono" font-size="${fsBig}">°F</text>`;
      for (let t = -20; t <= CMAX; t += 10) {
        const x = xC(t), z = t === 0;
        s += `<line x1="${x}" y1="${yC - (z ? 14 : 7)}" x2="${x}" y2="${yC}" stroke="#5ed3ae" stroke-width="${z ? 2.5 : 1}"/>`;
        if (t % cStep === 0) s += `<text x="${x}" y="${yC - 18}" fill="${z ? "#e9eef5" : "#5ed3ae"}" font-family="IBM Plex Mono" font-size="${z ? fsBig : fs}" text-anchor="middle">${t}</text>`;
      }
      for (let f = -20; f <= 230; f += 20) {
        const x = xC((f - 32) / 1.8);
        if (x < X0 - 1 || x > X1 + 1) continue;
        s += `<line x1="${x}" y1="${yF}" x2="${x}" y2="${yF + 7}" stroke="#a08df2" stroke-width="1"/>`;
        if (f % fStep === 0) s += `<text x="${x}" y="${yF + 12 + fs}" fill="#a08df2" font-family="IBM Plex Mono" font-size="${fs}" text-anchor="middle">${f}</text>`;
      }
      // the two zeros
      const x0c = xC(0), x0f = xC(-32 / 1.8);
      s += `<line x1="${x0f}" y1="${yF - 14}" x2="${x0f}" y2="${yF}" stroke="#e9eef5" stroke-width="2.5"/>`;
      if (!narrow) s += `<text x="${x0f}" y="${yF + 40}" fill="#e9eef5" font-family="IBM Plex Mono" font-size="12" text-anchor="middle">0 °F</text>`;
      s += `<line x1="${x0c}" y1="${yC}" x2="${x0c}" y2="${yF}" stroke="#e9eef5" stroke-dasharray="3 4" opacity=".5"/>`;
      s += `<text x="${x0c + 4}" y="${(yC + yF) / 2 + 4}" fill="#cbd5e2" font-family="IBM Plex Mono" font-size="${fs}">0 °C = 32 °F</text>`;
      const marks = mode === "point" ? [a] : [a, b];
      if (mode === "gap") {
        const xa = xC(Math.min(a, b)), xb = xC(Math.max(a, b));
        s += `<rect x="${xa}" y="${yC + 4}" width="${xb - xa}" height="${yF - yC - 8}" fill="#e3ab45" opacity=".12"/>`;
      }
      marks.forEach((t) => {
        const x = xC(t);
        s += `<line x1="${x}" y1="${yC - 4}" x2="${x}" y2="${yF + 4}" stroke="#e3ab45" stroke-width="2.5"/>`;
        s += `<circle cx="${x}" cy="${yC}" r="4.5" fill="#e3ab45"/><circle cx="${x}" cy="${yF}" r="4.5" fill="#e3ab45"/>`;
      });
      return s + `</svg>`;
    }
    function slider(val, label, onIn) {
      const w = el(`<label style="display:block;margin:6px 0"><span style="font-size:13px;color:var(--muted)">${fmt(label)}</span>
        <input class="slider" type="range" min="-20" max="105" step="1" value="${val}"></label>`);
      w.querySelector("input").addEventListener("input", (e) => onIn(+e.target.value));
      return w;
    }
    function update() {
      stage.innerHTML = svg();
      if (mode === "point") {
        ro.innerHTML = `<div class="eq"><span class="lbl">צלזיוס</span><span class="math"><span class="tm">T = ${a} °C</span></span></div>
          <div class="eq"><span class="lbl">פרנהייט</span><span class="math"><span class="tf">T</span> = 1.8 · ${a} <span class="hl">+ 32</span> = <span class="tf">${r1(1.8 * a + 32)} °F</span></span></div>`;
        note.innerHTML = fmt(T.s3_pointNote);
      } else {
        const d = Math.abs(b - a), fa = 1.8 * a + 32, fbv = 1.8 * b + 32;
        ro.innerHTML = `<div class="eq"><span class="lbl">צלזיוס</span><span class="math"><span class="tm">ΔT = |${b} − ${a}| = ${d} °C</span></span></div>
          <div class="eq"><span class="lbl">פרנהייט</span><span class="math"><span class="tf">ΔT</span> = |${r1(fbv)} − ${r1(fa)}| = <span class="tf">${r1(1.8 * d)} °F</span> = <span class="hl">1.8</span> · ${d}</span></div>`;
        note.innerHTML = fmt(T.s3_gapNote);
      }
    }
    function setMode(m) {
      mode = m;
      c.querySelectorAll("[data-m]").forEach((x) => x.classList.toggle("sel", x.dataset.m === m));
      sl.innerHTML = "";
      if (m === "point") sl.appendChild(slider(a, "טמפרטורה", (v) => { a = v; update(); }));
      else {
        sl.appendChild(slider(a, "קריאה ראשונה", (v) => { a = v; seenGap.moved = true; update(); }));
        sl.appendChild(slider(b, "קריאה שנייה", (v) => { b = v; seenGap.moved = true; update(); }));
        qbox.classList.remove("hidden");
      }
      update();
    }
    c.querySelectorAll("[data-m]").forEach((x) => x.addEventListener("click", () => setMode(x.dataset.m)));
    const qbox = c.querySelector(".qbox");
    qbox.classList.add("hidden");
    choice(qbox, T.s3_q, [
      { label: T.s3_qA, ok: true, fb: T.s3_qOk },
      { label: T.s3_qB, ok: false, fb: T.s3_qBad }
    ], () => markDone(2));
    setMode("point");
    document.addEventListener("lomda:step", (e) => { if (e.detail === 2) update(); });
    window.addEventListener("resize", () => { if (state.step === 2) update(); });
    stepsBox.appendChild(c);
  })();

  // ================= STEP 4 =================
  (function () {
    const c = el(`<section class="card hidden"></section>`);
    c.innerHTML = `<h2>${fmt(T.s4_title)}</h2><p>${fmt(T.s4_intro)}</p><div class="items"></div><div class="note hidden">${fmt(T.s4_done)}</div>`;
    const items = c.querySelector(".items"), note = c.querySelector(".note");
    const right = new Array(T.s4_items.length).fill(false);
    T.s4_items.forEach((it, i) => {
      const box = el(`<div class="item"><div class="qq">${fmt(it.q)}</div>
        <div class="row"><button type="button" class="btn" data-a="ruler">${fmt(T.s4_btnRuler)}</button>
        <button type="button" class="btn" data-a="eq">${fmt(T.s4_btnEq)}</button></div><div class="fb hidden"></div></div>`);
      box.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
        box.querySelectorAll("[data-a]").forEach((x) => x.classList.remove("sel"));
        b.classList.add("sel");
        const ok = b.dataset.a === it.a;
        fb(box.querySelector(".fb"), ok, ok ? it.ok : it.bad);
        right[i] = ok;
        if (right.every(Boolean)) { note.classList.remove("hidden"); markDone(3); }
      }));
      items.appendChild(box);
    });
    stepsBox.appendChild(c);
  })();

  // ================= STEP 5 =================
  (function () {
    const c = el(`<section class="card hidden"></section>`);
    c.innerHTML = `<h2>${fmt(T.s5_title)}</h2><p>${fmt(T.s5_intro)}</p><div class="mc"></div>
      <p class="q">${fmt(T.s5_numIntro)}</p><div class="nums"></div><div class="fb ok hidden"></div>`;
    const done = { mc: false, n: [false, false, false] };
    const fin = c.querySelector(".fb.ok");
    function maybeFinish() {
      if (done.mc && done.n.every(Boolean)) { fin.classList.remove("hidden"); fin.innerHTML = fmt(T.s5_allDone); markDone(4); }
    }
    choice(c.querySelector(".mc"), "", [
      { label: T.s5_optA, ok: true, fb: T.s5_okA },
      { label: T.s5_optB, ok: false, fb: T.s5_badB }
    ], () => { done.mc = true; maybeFinish(); });
    c.querySelector(".mc .q").remove();
    const qs = [
      { t: T.s5_n1, ans: 77, tol: 0.5 },
      { t: T.s5_n2, ans: 45, tol: 0.5 },
      { t: T.s5_n3, ans: 298.15, tol: 0.6 }
    ];
    qs.forEach((q, i) => {
      const r = el(`<div class="num"><span class="lab">${fmt(q.t)}</span>
        <input type="text" inputmode="decimal" aria-label="${esc(q.t)}">
        <button type="button" class="btn">${fmt(T.s5_check)}</button><span class="res" role="status"></span></div>`);
      const inp = r.querySelector("input"), res = r.querySelector(".res");
      function check() {
        const v = parseNum(inp.value);
        const ok = v !== null && Math.abs(v - q.ans) <= q.tol;
        res.className = "res " + (ok ? "ok" : "bad");
        res.textContent = ok ? "✓ " + T.s5_ok : T.s5_bad;
        if (ok) { done.n[i] = true; maybeFinish(); }
      }
      r.querySelector(".btn").addEventListener("click", check);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
      c.querySelector(".nums").appendChild(r);
    });
    stepsBox.appendChild(c);
  })();

  render();
})();
</script>
</body>
</html>
