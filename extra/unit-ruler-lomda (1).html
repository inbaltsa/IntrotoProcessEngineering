@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.uc-root{
  --ink:#10141c; --panel:#181e29; --panel2:#202836; --line:#2f3949;
  --chalk:#e9eef5; --muted:#8b99ae;
  --brass:#e3ab45; --mint:#5ed3ae; --clay:#e2685f; --violet:#a08df2;
  direction:rtl; background:var(--ink); color:var(--chalk);
  font-family:'Heebo',system-ui,sans-serif; min-height:100vh;
  padding:26px 16px 70px; box-sizing:border-box;
}
.uc-root *{box-sizing:border-box;}
.uc-shell{max-width:900px;margin:0 auto;}

.uc-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;
  color:var(--brass);text-transform:uppercase;margin:0 0 6px;}
.uc-title{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(28px,5vw,44px);
  line-height:1.1;margin:0 0 8px;}
.uc-sub{color:var(--muted);font-weight:300;font-size:16px;margin:0 0 24px;max-width:62ch;}

.uc-steps{display:flex;gap:4px;margin-bottom:26px;flex-wrap:wrap;}
.uc-step{flex:1 1 120px;background:none;border:0;padding:10px 8px 12px;cursor:pointer;
  text-align:right;border-top:3px solid var(--line);color:var(--muted);
  font-family:'Heebo',sans-serif;font-size:13px;transition:.2s;}
.uc-step:hover{color:var(--chalk);}
.uc-step.on{border-top-color:var(--brass);color:var(--chalk);font-weight:500;}
.uc-step.done{border-top-color:var(--mint);}
.uc-step-n{font-family:'IBM Plex Mono',monospace;font-size:11px;display:block;opacity:.7;}
.uc-step:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

.uc-card{background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:26px 24px;margin-bottom:16px;}
.uc-h2{font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:700;margin:0 0 12px;}
.uc-p{font-size:16px;line-height:1.75;color:#cbd5e2;font-weight:300;margin:0 0 14px;max-width:66ch;}
.uc-p b{font-weight:500;color:var(--chalk);}
.uc-note{border-right:3px solid var(--violet);padding:8px 14px;background:#1c2130;
  color:#c3cbdb;font-size:15px;line-height:1.7;font-weight:300;margin:16px 0 0;}
.uc-note b{color:var(--violet);font-weight:500;}

.uc-ruler-wrap{overflow-x:auto;padding:14px 2px 6px;margin:18px 0;}
.uc-ruler{display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;
  min-width:min-content;}
.uc-cell{display:flex;flex-direction:column;min-width:78px;}
.uc-cell + .uc-cell{border-left:1px solid var(--line);}
.uc-cell-top,.uc-cell-bot{display:flex;align-items:center;justify-content:center;gap:5px;
  padding:10px 14px;min-height:44px;white-space:nowrap;}
.uc-cell-top{border-bottom:2px solid var(--brass);position:relative;}
.uc-cell-top::after{content:'';position:absolute;left:0;right:0;bottom:-7px;height:5px;
  background-image:repeating-linear-gradient(to right,var(--brass) 0 1px,transparent 1px 9px);
  opacity:.3;}
.uc-num{font-size:19px;font-weight:500;color:var(--chalk);}
.uc-unit{font-size:19px;font-weight:400;color:var(--brass);position:relative;}
.uc-unit.uc-x{color:#5d6779;}
.uc-unit.uc-x::after{content:'';position:absolute;left:-3px;right:-3px;top:48%;height:2px;
  background:var(--clay);transform-origin:left center;transform:rotate(-14deg);
  animation:uc-strike .3s ease-out;}
@keyframes uc-strike{from{transform:rotate(-14deg) scaleX(0);}to{transform:rotate(-14deg) scaleX(1);}}
.uc-eq{font-size:22px;color:var(--muted);padding:0 16px;}
.uc-res{display:flex;align-items:center;gap:8px;background:#1d2432;border:1px solid var(--line);
  padding:8px 16px;}
.uc-res-num{color:var(--mint);font-size:21px;font-weight:600;}
.uc-ufrac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;}
.uc-ufrac span{font-size:15px;color:var(--brass);}
.uc-ufrac .uc-den{border-top:1px solid var(--brass);padding-top:1px;}
.uc-flat{font-size:18px;color:var(--brass);}
.uc-empty{color:var(--muted);font-size:15px;}

.uc-btn{font-family:'Heebo',sans-serif;font-size:15px;font-weight:500;padding:10px 20px;
  background:var(--panel2);color:var(--chalk);border:1px solid var(--line);
  border-radius:2px;cursor:pointer;transition:.18s;}
.uc-btn:hover{border-color:var(--brass);color:var(--brass);}
.uc-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.uc-btn.primary{background:var(--brass);color:#171208;border-color:var(--brass);font-weight:700;}
.uc-btn.primary:hover{background:#f0bb57;color:#171208;}
.uc-btn:disabled{opacity:.35;cursor:not-allowed;}
.uc-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;}

.uc-pool{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 4px;}
.uc-fac{background:var(--panel2);border:1px solid var(--line);border-radius:2px;
  padding:12px 18px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.18s;min-width:104px;}
.uc-fac:hover{border-color:var(--brass);}
.uc-fac:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
.uc-fac.sel{border-color:var(--mint);background:#1b2b28;}
.uc-fac:disabled{opacity:.4;cursor:not-allowed;}
.uc-fac-t{font-size:17px;}
.uc-fac-b{font-size:17px;border-top:1px solid var(--muted);padding-top:3px;}
.uc-fac-u{color:var(--brass);}
.uc-fac-tag{font-size:11px;color:var(--muted);font-family:'Heebo',sans-serif;margin-top:4px;}
.uc-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.uc-chip{background:#1b2231;border:1px solid var(--line);padding:6px 10px;border-radius:2px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;align-items:center;gap:8px;}
.uc-chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;
  font-family:'Heebo',sans-serif;padding:2px 4px;}
.uc-chip button:hover{color:var(--brass);}

.uc-fb{padding:12px 16px;border-radius:2px;font-size:15px;line-height:1.65;margin-top:16px;
  font-weight:300;}
.uc-fb.ok{background:#16281f;border:1px solid #2f5c47;color:#a8e6cd;}
.uc-fb.no{background:#2a1a1a;border:1px solid #5c3230;color:#f0b8b3;}
.uc-fb b{font-weight:600;}

.uc-in{font-family:'IBM Plex Mono',monospace;font-size:17px;background:var(--ink);
  color:var(--chalk);border:1px solid var(--line);padding:9px 12px;width:130px;
  border-radius:2px;direction:ltr;text-align:center;}
.uc-in:focus{outline:none;border-color:var(--brass);}
.uc-inu{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:16px;}

.uc-prog{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:18px 22px;margin-top:16px;}
.uc-prog h3{font-family:'Frank Ruhl Libre',serif;font-size:18px;margin:0 0 12px;font-weight:700;}
.uc-goals{list-style:none;padding:0;margin:0;display:grid;gap:7px;}
.uc-goal{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);font-weight:300;}
.uc-goal.on{color:var(--chalk);}
.uc-tick{width:18px;height:18px;border:1px solid var(--line);border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-size:11px;color:transparent;flex:0 0 auto;}
.uc-goal.on .uc-tick{border-color:var(--mint);color:var(--mint);background:#16281f;}
.uc-bar{height:3px;background:var(--line);margin:14px 0 0;}
.uc-bar i{display:block;height:100%;background:var(--mint);transition:width .35s ease;}
.uc-sync{font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin:10px 0 0;letter-spacing:.04em;}
.uc-sync.live{color:var(--mint);}
.uc-sync.off{color:var(--muted);}

.uc-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;}

.uc-svg-wrap{background:#141a24;border:1px solid var(--line);padding:18px 10px;margin:18px 0;
  overflow-x:auto;}
.uc-list{color:#cbd5e2;font-weight:300;font-size:16px;line-height:1.85;padding-right:20px;margin:0;}
.uc-list li{margin-bottom:6px;}
.uc-list b{color:var(--chalk);font-weight:500;}
.uc-inline{font-family:'IBM Plex Mono',monospace;color:var(--brass);font-size:15px;}

@media (max-width:560px){
  .uc-card{padding:20px 15px;}
  .uc-cell-top,.uc-cell-bot{padding:9px 10px;}
  .uc-num,.uc-unit{font-size:17px;}
}
@media (prefers-reduced-motion:reduce){
  .uc-root *{animation:none !important;transition:none !important;}
}
