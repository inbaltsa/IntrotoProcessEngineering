# RTL + עברית
lang: he
dir: rtl

website:
  google-analytics: "G-9L4PW59LRK"
  
# פילטרים ל-HTML
filters:
  - assets/strip-dir.lua
  - assets/env-to-callout.lua
  - assets/wordstyles-to-quarto.lua

