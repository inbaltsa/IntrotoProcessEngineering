project:
  type: book

book:
  title: "שם הספר החדש"
  author: "שם המחבר/ת"
  chapters:
    - index.qmd
    - intro.qmd
    - chapter1.qmd
    - chapter2.qmd
    - chapter3.qmd  
    
  downloads: [pdf]        # כפתור הורדת PDF
  output-file: "index"    # שם קובץ ה-PDF/HTML העיקרי
  sidebar:
    logo: assets/logo.png
    logo-alt: "הלוגו של הספר"
    logo-href: "/"

format:
  html:
    theme: default
    toc: true
    number-sections: true
    df-print: paged
    css:
      - assets/styles.css
      - assets/rtl-baseline.css
    include-after-body:
      - assets/auto-env-titles.html
      - assets/chapter-numbering.html
  pdf:
    pdf-engine: xelatex         # חשוב לעברית
    mainfont: "Noto Sans Hebrew" # או "Arial" אם מעדיפה
    documentclass: scrreprt
    number-sections: true

# RTL + עברית
lang: he

# פילטרים ל-HTML
filters:
  - assets/env-to-callout.lua

resources:
  - index.pdf

