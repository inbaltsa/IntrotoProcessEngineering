
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סימולטור מעברי פאזה מתקדם</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 950px;
            width: 100%;
            text-align: center;
        }

        h1 { margin: 10px 0; color: #2c3e50; }

        /* אזור הבחירה העליון */
        .top-controls {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #bbdefb;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1em;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            background: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }
        .radio-group label { cursor: pointer; font-size: 0.9em; }

        /* קנבס */
        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        canvas { touch-action: none; cursor: crosshair; }

        /* אזור מידע */
	/* משנים את הגריד ל-3 עמודות שוות */
	.info-panel {
  	  display: grid;
	  grid-template-columns: 1fr 1fr 1fr; 
  	  gap: 15px;
 	  margin-top: 20px;
  	  text-align: right;
	}

	/* מוסיפים עיצוב לקוביה החדשה (סגול בהיר) */
	.stats-box {
  	  background: #f3e5f5;
	  border-right: 5px solid #8e24aa;
          padding: 15px;
          border-radius: 4px;
          font-size: 0.9em;
          line-height: 1.6;
        }

        .state-box {
            background: #fff3e0;
            border-right: 5px solid #ff9800;
            padding: 15px;
            border-radius: 4px;
        }
        #state-value { font-size: 1.8em; font-weight: 800; color: #e65100; margin: 5px 0; line-height: 1.2; }
        
        .data-box {
            background: #f1f8e9;
            border-right: 5px solid #8bc34a;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        /* סליידרים */
        .controls {
            margin-top: 20px;
            padding: 20px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }

        .slider-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }
        
        .slider-label { width: 100px; font-weight: bold; text-align: left; }
        .slider-val-min { width: 60px; text-align: right; font-size: 0.85em; color: #666; }
        .slider-val-max { width: 60px; text-align: left; font-size: 0.85em; color: #666; }
        
        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            height: 6px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }

        .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 10px; font-size: 0.9em; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }

    </style>
</head>
<body>

    <div class="container">
        <h1>דיאגרמת פאזות אינטראקטיבית</h1>

        <div class="top-controls">
            <div class="control-group">
                <label for="materialSelect"><b>חומר:</b></label>
                <select id="materialSelect">
                    <option value="ethanol">אתנול (Ethanol)</option>
                    <option value="water">מים (Water)</option>
                    <option value="co2">פחמן דו-חמצני (CO₂)</option>
                </select>
            </div>

            <div class="control-group">
                <b>סוג ציר לחץ:</b>
                <div class="radio-group">
                    <label><input type="radio" name="scaleMode" value="log" checked> לוגריתמי</label>
                    <label><input type="radio" name="scaleMode" value="linear"> רגיל (לינארי)</label>
                </div>
            </div>
        </div>

        <div class="legend">
            <div><span class="dot" style="background:#e0e0e0"></span>מוצק</div>
            <div><span class="dot" style="background:#bbdefb"></span>נוזל</div>
            <div><span class="dot" style="background:#fff9c4"></span>גז</div>
        </div>

        <div class="canvas-container">
            <canvas id="phaseCanvas" width="850" height="500"></canvas>
        </div>

        <div class="info-panel">
            <div class="state-box">
                <div>מצב חומר:</div>
                <div id="state-value">--</div>
                <div id="coords-display" style="direction: ltr; font-weight:bold; color:#555;"></div>
            </div>

	    <div class="stats-box" id="stats-display">
        	</div>
            <div class="data-box" id="material-desc">
                </div>
        </div>

        <div class="controls">
            <div class="slider-row">
                <div class="slider-label">טמפרטורה</div>
                <div id="t-min" class="slider-val-min">0 K</div>
                <input type="range" id="tempSlider">
                <div id="t-max" class="slider-val-max">600 K</div>
            </div>

            <div class="slider-row">
                <div class="slider-label">לחץ</div>
                <div id="p-min" class="slider-val-min">0 atm</div>
                <input type="range" id="pressSlider">
                <div id="p-max" class="slider-val-max">100 atm</div>
            </div>
        </div>
    </div>

    <script>
        // --- נתוני חומרים ---
        const materials = {

    ethanol: {
        name: "אתנול",
        minT: 0, maxT: 600,
        minP_log: -6, maxP_log: 2.5,
        minP_lin: 0, maxP_lin: 80,
        tp: { t: 150, p: 4.3e-6 },
        cp: { t: 514, p: 62.2 },
        // נתונים חדשים לתצוגה:
        tMelt1atm: 159,
        tBoil1atm: 351, 
        meltSlope: "positive",
        desc:"אם ברצוננו לנתח את התנהגות החומר בטפרטורות נמוכות ולחצים נמוכים, האם נעדיף לעבוד בסקאלה הלוגריתמית או הרגילה? מדוע?"
    },
    water: {
        name: "מים",
        minT: 150, maxT: 700,
        minP_log: -3, maxP_log: 3, 
        minP_lin: 0, maxP_lin: 250,
        tp: { t: 273.16, p: 0.006 },
        cp: { t: 647, p: 218 },
        // נתונים חדשים לתצוגה:
        tMelt1atm: 273, // 0 מעלות צלזיוס
        tBoil1atm: 373, // 100 מעלות צלזיוס
        meltSlope: "negative",
        desc: "מה השיפוע של קו מעבר הפאזה בין הנוזל למוצק? איזו תכונה זה מסביר?."
    },
    co2: {
        name: "CO₂",
        minT: 100, maxT: 350,
        minP_log: -1, maxP_log: 2.5,
        minP_lin: 0, maxP_lin: 100,
        tp: { t: 216.6, p: 5.11 },
        cp: { t: 304, p: 72.8 },
        // נתונים חדשים לתצוגה (CO2 ממריא ב-1 אטמוספירה):
        tSub1atm: 195, // קרח יבש
        meltSlope: "positive",
        desc: "ידוע כי פחמן דו חמצני עובר המראה בטמפרטורת החדר (קרח יבש), הסבירו תופעה זו באמצעות הגרף."
    }
};
        // --- משתנים גלובליים ---
        let curMat = materials.ethanol;
        let isLogScale = true; 
        let currentT = 300;
        let currentP = 1;

        const canvas = document.getElementById('phaseCanvas');
        const ctx = canvas.getContext('2d');
        const margin = { top: 30, right: 30, bottom: 50, left: 70 };
        let W, H;

        // אלמנטים ב-DOM
        const sT = document.getElementById('tempSlider');
        const sP = document.getElementById('pressSlider');
        const sMat = document.getElementById('materialSelect');
        const radios = document.getElementsByName('scaleMode');
        const descDiv = document.getElementById('material-desc');
        
        // אלמנטים לטקסט קצה
        const lblTmin = document.getElementById('t-min');
        const lblTmax = document.getElementById('t-max');
        const lblPmin = document.getElementById('p-min');
        const lblPmax = document.getElementById('p-max');

        // --- חישובי המרה (Scale Mapping) ---

        function resize() {
            W = canvas.width - margin.left - margin.right;
            H = canvas.height - margin.top - margin.bottom;
        }
        resize();

        // המרת T לפיקסל
        function tToX(t) {
            return margin.left + ((t - curMat.minT) / (curMat.maxT - curMat.minT)) * W;
        }
        function xToT(x) {
            let val = curMat.minT + ((x - margin.left) / W) * (curMat.maxT - curMat.minT);
            return Math.max(curMat.minT, Math.min(curMat.maxT, val));
        }

        // המרת P לפיקסל (תלוי בסקאלה)
        function pToY(p) {
            if (p <= 0 && isLogScale) p = Math.pow(10, curMat.minP_log); // הגנה
            
            let norm = 0;
            if (isLogScale) {
                let logP = Math.log10(p);
                norm = (logP - curMat.minP_log) / (curMat.maxP_log - curMat.minP_log);
            } else {
                norm = (p - curMat.minP_lin) / (curMat.maxP_lin - curMat.minP_lin);
            }
            // היפוך ציר Y (0 למטה)
            return margin.top + H - (norm * H);
        }

        function yToP(y) {
            let relative = (margin.top + H - y) / H; // 0..1
            if (isLogScale) {
                let logVal = curMat.minP_log + relative * (curMat.maxP_log - curMat.minP_log);
                return Math.pow(10, logVal);
            } else {
                return curMat.minP_lin + relative * (curMat.maxP_lin - curMat.minP_lin);
            }
        }

        // --- נוסחאות פיזיקליות מקורבות (זהות למקודם) ---
        // עקומה 1: המראה (Sublimation)
        function getSubCurve(t) {
            if (t > curMat.tp.t) return null;
            // קירוב לאנטואן דרך TP ונקודה נמוכה
            let t1 = curMat.tp.t, p1 = curMat.tp.p;
            // נקודת עוגן שרירותית לשיפוע
            let t2 = t1 * 0.8, p2 = p1 * 0.01; 
            
            let B = (Math.log(p1) - Math.log(p2)) / (1/t2 - 1/t1); // שימוש ב ln
            let A = Math.log(p1) + B/t1;
            
            let p = Math.exp(A - B/t);
            return p;
        }

        // עקומה 2: רתיחה (Boiling)
        function getBoilCurve(t) {
            if (t < curMat.tp.t || t > curMat.cp.t) return null;
            let t1 = curMat.tp.t, p1 = curMat.tp.p;
            let t2 = curMat.cp.t, p2 = curMat.cp.p;
            
            let B = (Math.log(p1) - Math.log(p2)) / (1/t2 - 1/t1);
            let A = Math.log(p1) + B/t1;
            
            let p = Math.exp(A - B/t);
            return p;
        }

        // עקומה 3: היתוך (Melting) - החזרת T כפונקציה של P
        function getMeltT(p) {
            if (p < curMat.tp.p) return null;
            let slope = 0.02; // רגיל
            if (curMat.meltSlope === "negative") slope = -0.01; // מים (מוגזם מעט שיראו)
            
            return curMat.tp.t + slope * (p - curMat.tp.p);
        }

        // --- ציור ---
        function drawGrid() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            ctx.strokeStyle = "#e0e0e0";
            ctx.lineWidth = 1;
            ctx.fillStyle = "#666";
            ctx.font = "12px Arial";
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";

            // ציר Y (לחץ)
            if (isLogScale) {
                // לוגריתמי: שנתות לפי חזקות
                let minExp = Math.ceil(curMat.minP_log);
                let maxExp = Math.floor(curMat.maxP_log);
                for (let exp = minExp; exp <= maxExp; exp++) {
                    let val = Math.pow(10, exp);
                    let y = pToY(val);
                    
                    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left+W, y); ctx.stroke();
                    
                    let txt = "10" + getSuperscript(exp);
                    if (exp===0) txt="1";
                    if (exp===1) txt="10";
                    if (exp===2) txt="100";
                    ctx.fillText(txt, margin.left-10, y);
                }
                // כותרת ציר
                drawYLabel("לחץ (atm) [לוגריתמי]");

            } else {
                // לינארי: שנתות שוות
                let range = curMat.maxP_lin - curMat.minP_lin;
                let step = range / 5; // 5 מרווחים
                for (let val = curMat.minP_lin; val <= curMat.maxP_lin; val += step) {
                    let y = pToY(val);
                    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left+W, y); ctx.stroke();
                    ctx.fillText(Math.round(val), margin.left-10, y);
                }
                drawYLabel("לחץ (atm) [לינארי]");
            }

            // ציר X (טמפרטורה) - תמיד לינארי
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            let stepT = 100;
            for (let t = 0; t <= curMat.maxT; t+=stepT) {
                if(t < curMat.minT) continue;
                let x = tToX(t);
                ctx.beginPath(); ctx.moveTo(x, margin.top); ctx.lineTo(x, margin.top+H); ctx.stroke();
                ctx.fillText(t, x, margin.top+H+8);
            }
            
            // מסגרת
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;
            ctx.strokeRect(margin.left, margin.top, W, H);
            
            ctx.fillText("טמפרטורה (K)", margin.left + W/2, margin.top+H+25);
        }

        function drawYLabel(text) {
            ctx.save();
            ctx.translate(25, margin.top + H/2);
            ctx.rotate(-Math.PI/2);
            ctx.textAlign = "center";
            ctx.font = "bold 14px Arial";
            ctx.fillStyle = "#333";
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        function getSuperscript(num) {
            const map = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
            return num.toString().split('').map(c => map[c]).join('');
        }

        function drawCurves() {
            // נבנה אזורים ע"י path
            const maxY = margin.top; // למעלה
            const minY = margin.top + H; // למטה
            const minX = margin.left;
            const maxX = margin.left + W;

            // 1. אזור גז: כל מה שמתחת לסובלימציה ורתיחה
            ctx.fillStyle = "rgba(255, 249, 196, 0.6)";
            ctx.beginPath();
            ctx.moveTo(maxX, minY); // ימין למטה
            ctx.lineTo(minX, minY); // שמאל למטה
            
            // עולה לאורך סובלימציה
            let step = 2;
            let tpX = tToX(curMat.tp.t);
            
            for (let x = minX; x <= tpX; x+=step) {
                let t = xToT(x);
                let p = getSubCurve(t);
                if(p) {
                    let y = pToY(p);
                    if (y < minY) ctx.lineTo(x, y); 
                    else ctx.lineTo(x, minY);
                }
            }
            
            // ממשיך לאורך רתיחה
            let cpX = tToX(curMat.cp.t);
            for (let x = tpX; x <= cpX; x+=step) {
                let t = xToT(x);
                let p = getBoilCurve(t);
                if(p) ctx.lineTo(x, pToY(p));
            }
            // קו ישר ימינה מה-CP (גבול ויזואלי לגז)
            ctx.lineTo(maxX, pToY(curMat.cp.p));
            ctx.closePath();
            ctx.fill();

            // 2. אזור נוזל
            ctx.fillStyle = "rgba(187, 222, 251, 0.6)";
            ctx.beginPath();
            ctx.moveTo(tpX, pToY(curMat.tp.p)); // התחלה ב-TP
            // לאורך רתיחה עד CP
             for (let x = tpX; x <= cpX; x+=step) {
                let t = xToT(x);
                let p = getBoilCurve(t);
                if(p) ctx.lineTo(x, pToY(p));
            }
            // למעלה מה-CP
            ctx.lineTo(cpX, maxY);
            
            // חזרה שמאלה למעלה עד קו ההיתוך
            // בגלל שקו ההיתוך אנכי כמעט, נמצא את ה-X העליון שלו
            let topP = isLogScale ? Math.pow(10, curMat.maxP_log) : curMat.maxP_lin;
            let topMeltT = getMeltT(topP);
            ctx.lineTo(tToX(topMeltT), maxY);
            
            // ירידה לאורך קו ההיתוך עד TP
            // נרוץ לפי Y
            let startY = maxY;
            let endY = pToY(curMat.tp.p);
            for (let y = startY; y <= endY; y+=step) {
                let p = yToP(y);
                let t = getMeltT(p);
                ctx.lineTo(tToX(t), y);
            }
            ctx.closePath();
            ctx.fill();

            // 3. אזור מוצק
            ctx.fillStyle = "rgba(224, 224, 224, 0.6)";
            ctx.beginPath();
            ctx.moveTo(minX, maxY); // שמאל למעלה
            // יורד לאורך קו ההיתוך
            for (let y = maxY; y <= endY; y+=step) {
                let p = yToP(y);
                let t = getMeltT(p);
                ctx.lineTo(tToX(t), y);
            }
            // אחורה לאורך סובלימציה (מ-TP לשמאל)
            for (let x = tpX; x >= minX; x-=step) {
                let t = xToT(x);
                let p = getSubCurve(t);
                if(p) {
                    let y = pToY(p);
                    if (y > minY) y = minY; // Clamp
                    ctx.lineTo(x, y);
                } else {
                    ctx.lineTo(x, minY);
                }
            }
            ctx.lineTo(minX, minY);
            ctx.closePath();
            ctx.fill();

            // --- קווים מודגשים ---
            ctx.lineWidth = 3; ctx.strokeStyle="#455a64"; ctx.lineCap="round";
            
            // היתוך
            ctx.beginPath();
            for (let y = maxY; y <= endY; y+=step) {
                let p = yToP(y); let t = getMeltT(p);
                if (y==maxY) ctx.moveTo(tToX(t), y); else ctx.lineTo(tToX(t), y);
            }
            ctx.stroke();

            // רתיחה
            ctx.beginPath();
            for (let x = tpX; x <= cpX; x+=step) {
                let t = xToT(x); let p = getBoilCurve(t);
                if(p) { if(x==tpX) ctx.moveTo(x, pToY(p)); else ctx.lineTo(x, pToY(p)); }
            }
            ctx.stroke();

            // סובלימציה
            ctx.beginPath();
            for (let x = minX; x <= tpX; x+=step) {
                let t = xToT(x); let p = getSubCurve(t);
                if(p) { 
                    let y = pToY(p);
                    if(y > minY) continue; // לא לצייר מחוץ לגרף
                    if(x==minX) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
            }
            ctx.stroke();
            
            // --- קו 1 atm ---
            let y1 = pToY(1);
            if(y1 > maxY && y1 < minY) {
                ctx.beginPath(); ctx.strokeStyle="rgba(0,0,0,0.3)"; ctx.setLineDash([5,5]); ctx.lineWidth=1;
                ctx.moveTo(minX, y1); ctx.lineTo(maxX, y1); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle="#000"; ctx.fillText("1 atm", maxX-5, y1-5);
            }

            // נקודות
            drawDot(curMat.tp.t, curMat.tp.p, "#d32f2f", "TP");
            drawDot(curMat.cp.t, curMat.cp.p, "#d32f2f", "CP");
        }

        function drawDot(t, p, color, txt) {
            let x = tToX(t);
            let y = pToY(p);
            if (x<margin.left || y>margin.top+H) return; // מחוץ לתחום

            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
            if(txt) {
                ctx.fillStyle="black"; ctx.font="bold 12px Arial"; ctx.textAlign="left";
                ctx.fillText(txt, x+8, y+4);
            }
        }

        function drawUser() {
            let x = tToX(currentT);
            let y = pToY(currentP);

            // קווקו
            ctx.strokeStyle = "#c0392b"; ctx.lineWidth=1; ctx.setLineDash([4,4]);
            ctx.beginPath(); ctx.moveTo(x, margin.top+H); ctx.lineTo(x, y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(x, y); ctx.stroke();
            ctx.setLineDash([]);

            // נקודה
            ctx.fillStyle = "#e74c3c"; ctx.strokeStyle="white"; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }

        function update() {
            drawGrid();
            drawCurves();
            drawUser();

            // עדכון טקסט מצב
            let state = checkState(currentT, currentP);
            document.getElementById('state-value').innerText = state;
		// --- הוסף את זה בתוך פונקציית update() בסוף ---

		const statsDiv = document.getElementById('stats-display');
		let statsHTML = `<b>ערכים קריטיים:</b><br>`;
		statsHTML += `T קריטי: ${curMat.cp.t} K<br>`;
		statsHTML += `P קריטי: ${curMat.cp.p} atm<br>`;
		statsHTML += `<hr style="margin:5px 0; border:0; border-top:1px solid #ccc;">`;

		// בדיקה אם זה חומר שממריא (כמו CO2) או רגיל
		if (curMat.tSub1atm) {
		    statsHTML += `<b>ב-1 atm:</b> המראה ב- ${curMat.tSub1atm} K`;
		} else {
 		   statsHTML += `<b>ב-1 atm:</b><br>`;
 		   statsHTML += `היתוך/קיפאון: ${curMat.tMelt1atm} K<br>`;
 		   statsHTML += `רתיחה: ${curMat.tBoil1atm} K`;
		}

statsDiv.innerHTML = statsHTML;
            
            let pTxt = currentP < 0.01 ? currentP.toExponential(2) : currentP.toFixed(2);
            document.getElementById('coords-display').innerText = `T: ${Math.round(currentT)} K | P: ${pTxt} atm`;
        }

        // בדיקת מצב (לוגיקה)
        function checkState(t, p) {
            if (p > curMat.cp.p && t > curMat.cp.t) return "זורם סופר-קריטי";
            
            // מתחת ל-TP
            if (t < curMat.tp.t) {
                let subP = getSubCurve(t);
                if(subP && Math.abs(p-subP)/p < 0.1) return "המראה/ריבוץ"; // 10% tolerance
                return p > subP ? "מוצק" : "גז";
            }
            
            // בדיקת היתוך
            let meltT = getMeltT(p);
            if (p > curMat.tp.p) {
                 if(Math.abs(t-meltT) < 2) return "היתוך/קיפאון";
                 if(t < meltT) return "מוצק";
            }

            // בדיקת רתיחה
            if (t < curMat.cp.t && p < curMat.cp.p) {
                let boilP = getBoilCurve(t);
                if(boilP && Math.abs(p-boilP)/p < 0.1) return "רתיחה/עיבוי";
                return p > boilP ? "נוזל" : "גז";
            }
            
            if (p >= curMat.cp.p) return "נוזל דחוס";
            return "גז";
        }

        // --- ניהול ממשק ---

    	function updateSlidersRange() {
            // עדכון סליידרים וטקסט קצה
            sT.min = curMat.minT; sT.max = curMat.maxT;
            lblTmin.innerText = curMat.minT + " K"; lblTmax.innerText = curMat.maxT + " K";

            if (isLogScale) {
                sP.min = 0; sP.max = 1000;
                let minVal = Math.pow(10, curMat.minP_log); 
                let maxVal = Math.pow(10, curMat.maxP_log);
                
                lblPmin.innerText = minVal.toExponential(0) + " atm";
                
                // --- השינוי כאן: Math.round מעגל למספר שלם (למשל 316) ---
                lblPmax.innerText = maxVal < 1000 ? Math.round(maxVal) + " atm" : maxVal.toExponential(0) + " atm";
            } else {
                sP.min = curMat.minP_lin; sP.max = curMat.maxP_lin; sP.step = (curMat.maxP_lin - curMat.minP_lin)/500;
                lblPmin.innerText = curMat.minP_lin + " atm"; lblPmax.innerText = curMat.maxP_lin + " atm";
            }
            syncSlidersFromVal();
        }

        function syncSlidersFromVal() {
            sT.value = currentT;
            if (isLogScale) {
                // Convert P to Slider (0-1000)
                // log(P) -> normalize -> *1000
                let logP = Math.log10(currentP);
                if (currentP <= 0) logP = curMat.minP_log;
                let norm = (logP - curMat.minP_log) / (curMat.maxP_log - curMat.minP_log);
                sP.value = norm * 1000;
            } else {
                sP.value = currentP;
            }
        }

        // אירועים
        sMat.addEventListener('change', (e) => {
            curMat = materials[e.target.value];
            descDiv.innerHTML = curMat.desc;
            currentT = (curMat.minT + curMat.maxT)/2;
            currentP = 1; // תמיד התחלה ב-1 אטמוספירה
            updateSlidersRange();
            update();
        });

        radios.forEach(r => r.addEventListener('change', (e) => {
            isLogScale = (e.target.value === 'log');
            updateSlidersRange();
            update();
        }));

        sT.addEventListener('input', (e) => {
            currentT = parseFloat(e.target.value);
            update();
        });

        sP.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            if (isLogScale) {
                // Slider (0-1000) -> P
                let norm = val / 1000;
                let logP = curMat.minP_log + norm * (curMat.maxP_log - curMat.minP_log);
                currentP = Math.pow(10, logP);
            } else {
                currentP = val;
            }
            update();
        });

        // גרירה על הקנבס
        let isDrag = false;
        function handleDrag(ex, ey) {
            const rect = canvas.getBoundingClientRect();
            // פיקסלים בתוך הקנבס
            let x = (ex - rect.left) * (canvas.width / rect.width);
            let y = (ey - rect.top) * (canvas.height / rect.height);
            
            // הגבלה
            x = Math.max(margin.left, Math.min(margin.left+W, x));
            y = Math.max(margin.top, Math.min(margin.top+H, y));

            currentT = xToT(x);
            currentP = yToP(y);
            
            syncSlidersFromVal();
            update();
        }

        canvas.addEventListener('mousedown', (e)=>{isDrag=true; handleDrag(e.clientX, e.clientY)});
        window.addEventListener('mousemove', (e)=>{if(isDrag) handleDrag(e.clientX, e.clientY)});
        window.addEventListener('mouseup', ()=>{isDrag=false});
        canvas.addEventListener('touchstart', (e) => { isDrag = true; handleDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { if(isDrag) handleDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
        canvas.addEventListener('touchend', () => { isDrag = false; });

        // אתחול
        curMat = materials['ethanol'];
        descDiv.innerHTML = curMat.desc;
        updateSlidersRange();
        update();

    </script>
</body>
